<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Suspicious Email</title>
</head>
<body>

  <div class="container">
    <h1>Report a Suspicious Email</h1>
    <p>Please upload the email you believe may be a phishing attempt.</p>

    <form action="http://localhost:3000/api/submit" method="POST" enctype="multipart/form-data">

        <label for="name">Company Name:</label>
        <input type="text" id="company" name="company">

        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name">

        <label for="email">Your Email:</label>
        <input type="email" id="email" name="email">

        <label for="description">Any additional comments.</label>
        <textarea id="description" name="description" rows="4"></textarea>

        <label for="file">Upload Email (.eml file):</label>
        <input type="file" id="file" name="file" accept=".eml">

        <button type="submit">Submit</button>
    </form>
  </div>

</body>
</html>
