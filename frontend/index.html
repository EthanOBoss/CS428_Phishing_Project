<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Report Dashboard</title>
    <link rel="stylesheet" href="style.css?v=1">
    <meta name="color-scheme" content="light">
</head>
<body>
    <!-- Header -->
    <header>
        <h1 class="header">ORTSOC</h1>
    </header>
    <!-- Body -->
    <main>
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- All/Unreviewed Reports -->
            <form>
                <h2>View</h2>
                <label>
                    <input type="radio" name="filter" value="all" checked> All Reports
                </label>
                <label>
                    <input type="radio" name="filter" value="unreviewed"> Unreviewed
                </label>
            </form>
            <!-- Filter by client -->
            <form  id="clientFilter">
                <h2>Load by client</h2>
                <label>
                    <input type="radio" name="clientFilterRadio" value="noFilter" checked> All Clients
                </label>
                <div id="clientRadioContainer"></div>
            </form>
        </div>
        <!-- Mian Content -->
        <div class="container">
            <h1 class="dashHeader">Phishing Report Dashboard</h1>

            <div id="reportList" class="report-list">
                <!-- Reports will be loaded here -->
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
